name: documentation

on:
  pull_request:
  push:
    branches:
      - main

env:
  HUSKY: 0
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.x'

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Generate Docs
        run: pnpm moonwave build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  # Deploy if this isn't a CI run
  deploy:
    needs: build
    if: ${{ github.event_name == 'push' }} 
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
